<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Projects - Android Prep App</title>
  <script>
    (function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
      var params = new URLSearchParams(window.location.search);
      var forceDesktop = params.get('desktop') === 'true';
      var forceMobile = params.get('mobile') === 'true';
      
      if ((isMobile && !forceDesktop) || forceMobile) {
        window.location.replace("./android_prep_app/mobile.html");
      } else {
        window.location.replace("./android_prep_app/");
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .links-box {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 16px;
    }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #1e293b;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #334155;
    }
    a:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div>
    <h2>Android Lead & Staff Interview Prep Studio</h2>
    <p>Redirecting to the appropriate version for your device...</p>
    <div class="links-box">
      <a href="./android_prep_app/mobile.html">📱 Mobile Version</a>
      <a href="./android_prep_app/">💻 Desktop Studio</a>
    </div>
  </div>
</body>
</html>
